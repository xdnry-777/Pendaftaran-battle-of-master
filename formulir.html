<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULIR PENDAFTARAN - BATTLE OF MASTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pinkMain: '#FF4D88',
                        pinkDark: '#CC2E66',
                        pinkLight: '#FFE6EE',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        
        * {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #FFF5F8 0%, #FFE6EE 100%);
            padding: 16px;
            min-height: 100vh;
        }
        .wadah-form {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(255,77,136,0.1);
        }
        .link-kembali {
            color: #FF4D88;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 16px;
            font-size: 15px;
        }
        .judul-utama {
            font-size: 28px;
            font-weight: 700;
            color: #FF4D88;
            text-align: center;
            margin-bottom: 8px;
        }
        .keterangan-jenis {
            text-align: center;
            color: #6B7280;
            font-size: 15px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .bagian-kolom {
            background: #FFF5F8;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
        }
        .judul-bagian {
            font-size: 18px;
            font-weight: 700;
            color: #FF4D88;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .label-isian {
            font-size: 16px;
            font-weight: 600;
            color: #1F2937;
            margin-bottom: 6px;
            display: block;
        }
        .input-teks {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #FFE6EE;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 16px;
            outline: none;
            transition: all 0.2s ease;
            background: #ffffff;
        }
        .input-teks:focus {
            border-color: #FF4D88;
            box-shadow: 0 0 0 3px rgba(255,77,136,0.15);
        }
        /* === KOLOM UPLOAD YANG SUDAH DIRAPIKAN === */
        .kolom-upload {
            width: 100%;
            border: 2px dashed #FF4D88;
            border-radius: 12px;
            padding: 24px 16px;
            text-align: center;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #ffffff;
        }
        .kolom-upload:hover {
            background: #FFF5F8;
            border-color: #CC2E66;
        }
        .kolom-upload i {
            font-size: 32px;
            color: #FF4D88;
            margin-bottom: 8px;
            display: block;
        }
        .kolom-upload .teks-utama {
            font-size: 16px;
            font-weight: 600;
            color: #FF4D88;
            margin-bottom: 4px;
            display: block;
        }
        .kolom-upload .teks-kecil {
            font-size: 14px;
            color: #6B7280;
            display: block;
        }
        .info-pembayaran {
            background: #FFF5F8;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.7;
        }
        .info-pembayaran h4 {
            font-size: 17px;
            font-weight: 700;
            color: #FF4D88;
            margin-bottom: 10px;
        }
        .info-pembayaran p {
            font-size: 15px;
            color: #374151;
        }
        .info-pembayaran .nomor-akun {
            font-weight: 700;
            color: #FF4D88;
            font-size: 17px;
            margin: 8px 0;
        }
        .info-pembayaran img {
            width: 180px;
            border-radius: 10px;
            border: 2px solid #FF4D88;
            margin: 12px auto;
            display: block;
        }
        .tombol-kirim {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #FF4D88 0%, #FF6B9E 100%);
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tombol-kirim:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255,77,136,0.25);
        }
        .sembunyikan {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="wadah-form">
        <a href="index.html" class="link-kembali">
            <i class="fa fa-arrow-left"></i> Kembali ke Beranda
        </a>

        <h1 class="judul-utama">FORMULIR PENDAFTARAN</h1>
        <p id="teksJenis" class="keterangan-jenis"></p>

        <form id="formPendaftaran">
            <!-- BAGIAN DATA TIM -->
            <div class="bagian-kolom">
                <h3 class="judul-bagian">📌 DATA TIM</h3>

                <label class="label-isian">Nama Tim</label>
                <input type="text" id="namaTim" class="input-teks" placeholder="Masukkan nama tim kamu" required>

                <label class="label-isian">Nama Lengkap Kapten</label>
                <input type="text" id="namaKapten" class="input-teks" placeholder="Nama lengkap kapten tim" required>

                <label class="label-isian">Nomor WhatsApp Aktif</label>
                <input type="tel" id="waKapten" class="input-teks" placeholder="Contoh: 081234567890" required>

                <label class="label-isian">Logo Tim</label>
                <label class="kolom-upload">
                    <input type="file" id="logoTim" accept="image/*" class="hidden" required>
                    <i class="fa fa-image"></i>
                    <span class="teks-utama">Klik di sini untuk pilih logo tim</span>
                    <span class="teks-kecil">Format: JPG / PNG</span>
                </label>

                <label class="label-isian">Foto Jersey Tim</label>
                <label class="kolom-upload">
                    <input type="file" id="jerseyTim" accept="image/*" class="hidden">
                    <i class="fa fa-shield"></i>
                    <span class="teks-utama">Klik di sini untuk pilih foto jersey</span>
                    <span class="teks-kecil">Format: JPG / PNG</span>
                </label>
            </div>

            <!-- BAGIAN BUKTI SHARE LINK (KHUSUS GRATIS) -->
            <div id="kolomShare" class="bagian-kolom">
                <label class="label-isian">Bukti Share Link <span class="text-red-500 font-bold">*(Wajib 5 Foto)</span></label>
                <label class="kolom-upload">
                    <input type="file" id="buktiShare" accept="image/*" multiple class="hidden" required>
                    <i class="fa fa-upload"></i>
                    <span class="teks-utama">Klik di sini untuk pilih foto</span>
                    <span class="teks-kecil">Pilih tepat 5 file foto</span>
                </label>
            </div>

            <!-- BAGIAN PEMBAYARAN (KHUSUS BERBAYAR) -->
            <div id="kolomBayar" class="sembunyikan">
                <div class="info-pembayaran">
                    <h4>METODE PEMBAYARAN</h4>
                    <p>Scan QRIS di bawah ini atau transfer ke nomor Dana:</p>
                    <img src="qris.png" alt="QRIS Pembayaran">
                    <p class="nomor-akun">DANA: 0858xxxxxxx</p>
                    <p class="text-sm text-gray-500">An. Battle Of Master</p>
                    <p class="font-semibold text-pinkDark mt-2">Total: Rp 5.000 / Tim</p>
                </div>

                <label class="label-isian">Unggah Bukti Transfer</label>
                <label class="kolom-upload">
                    <input type="file" id="buktiTransfer" accept="image/*" class="hidden" required>
                    <i class="fa fa-file-text-o"></i>
                    <span class="teks-utama">Klik di sini untuk unggah bukti transfer</span>
                    <span class="teks-kecil">Format: JPG / PNG</span>
                </label>
            </div>

            <!-- BAGIAN DATA ANGGOTA -->
            <div class="bagian-kolom">
                <h3 class="judul-bagian">👥 DATA ANGGOTA TIM</h3>

                <label class="label-isian">Pemain 1</label>
                <input type="text" id="p1Nama" class="input-teks" placeholder="Nama lengkap pemain" required>
                <input type="tel" id="p1Wa" class="input-teks" placeholder="Nomor WhatsApp" required>

                <label class="label-isian">Pemain 2</label>
                <input type="text" id="p2Nama" class="input-teks" placeholder="Nama lengkap pemain" required>
                <input type="tel" id="p2Wa" class="input-teks" placeholder="Nomor WhatsApp" required>

                <label class="label-isian">Pemain 3</label>
                <input type="text" id="p3Nama" class="input-teks" placeholder="Nama lengkap pemain" required>
                <input type="tel" id="p3Wa" class="input-teks" placeholder="Nomor WhatsApp" required>

                <label class="label-isian">Pemain 4</label>
                <input type="text" id="p4Nama" class="input-teks" placeholder="Nama lengkap pemain" required>
                <input type="tel" id="p4Wa" class="input-teks" placeholder="Nomor WhatsApp" required>

                <label class="label-isian">Pemain 5 (Cadangan)</label>
                <input type="text" id="p5Nama" class="input-teks" placeholder="Nama lengkap pemain" required>
                <input type="tel" id="p5Wa" class="input-teks" placeholder="Nomor WhatsApp" required>

                <label class="label-isian">Pemain 6 (Cadangan)</label>
                <input type="text" id="p6Nama" class="input-teks" placeholder="Nama lengkap pemain" required>
                <input type="tel" id="p6Wa" class="input-teks" placeholder="Nomor WhatsApp" required>
            </div>

            <button type="submit" class="tombol-kirim">KIRIM PENDAFTARAN</button>
        </form>
    </div>

    <script>
        // === DETEKSI JENIS PENDAFTARAN ===
        const urlParams = new URLSearchParams(window.location.search);
        const jenisDaftar = urlParams.get('jenis') || 'gratis';
        const teksJenis = document.getElementById('teksJenis');
        const kolomShare = document.getElementById('kolomShare');
        const kolomBayar = document.getElementById('kolomBayar');
        const kuotaMaksimal = parseInt(localStorage.getItem('kuotaMaksimal') || '16');
        const totalTerdaftar = JSON.parse(localStorage.getItem('dataPendaftaran') || '[]').length;

        if(jenisDaftar === 'gratis') {
            teksJenis.textContent = `PENDAFTARAN GRATIS • BATTLE OF MASTER • Sisa kuota: ${kuotaMaksimal - totalTerdaftar} Tim`;
            kolomBayar.classList.add('sembunyikan');
            document.getElementById('buktiTransfer').removeAttribute('required');
        } else {
            teksJenis.textContent = `PENDAFTARAN BERBAYAR • BATTLE OF MASTER • Sisa kuota: ${kuotaMaksimal - totalTerdaftar} Tim`;
            kolomShare.classList.add('sembunyikan');
            document.getElementById('buktiShare').removeAttribute('required');
            kolomBayar.classList.remove('sembunyikan');
        }

        // === FUNGSI UBAH FILE KE LINK ===
        function bacaFile(file) {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        // === SIMPAN DATA KE PENYIMPANAN ===
        document.getElementById('formPendaftaran').addEventListener('submit', async e => {
            e.preventDefault();

            // Cek status pendaftaran
            if(!localStorage.getItem('pendaftaranDibuka') || totalTerdaftar >= kuotaMaksimal) {
                return alert("⚠️ Pendaftaran sudah ditutup atau kuota sudah penuh!");
            }

            // Ambil semua data isian
            const dataBaru = {
                jenis: jenisDaftar,
                namaTim: document.getElementById('namaTim').value.trim(),
                namaKapten: document.getElementById('namaKapten').value.trim(),
                waKapten: document.getElementById('waKapten').value.trim(),
                logo: await bacaFile(document.getElementById('logoTim').files[0]),
                jersey: document.getElementById('jerseyTim').files[0] ? await bacaFile(document.getElementById('jerseyTim').files[0]) : '',
                buktiShare: [],
                buktiTransfer: '',
                anggota: []
            };

            // Masukkan bukti sesuai jenis
            if(jenisDaftar === 'gratis') {
                const files = document.getElementById('buktiShare').files;
                if(files.length !== 5) return alert("⚠️ Wajib unggah tepat 5 foto bukti share link!");
                for(let f of files) dataBaru.buktiShare.push(await bacaFile(f));
            } else {
                dataBaru.buktiTransfer = await bacaFile(document.getElementById('buktiTransfer').files[0]);
            }

            // Masukkan data anggota
            for(let i=1; i<=6; i++) {
                dataBaru.anggota.push({
                    nama: document.getElementById(`p${i}Nama`).value.trim(),
                    wa: document.getElementById(`p${i}Wa`).value.trim()
                });
            }

            // Simpan ke penyimpanan lokal
            const semuaData = JSON.parse(localStorage.getItem('dataPendaftaran') || '[]');
            semuaData.push(dataBaru);
            localStorage.setItem('dataPendaftaran', JSON.stringify(semuaData));

            alert(`✅ Pendaftaran berhasil!\nTerima kasih sudah mendaftar sebagai ${jenisDaftar.toUpperCase()}`);
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
