<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULIR PENDAFTARAN - BATTLE OF MASTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coklatTerang: '#D4A574',
                        coklatUtama: '#B57F50',
                        coklatGelap: '#8B5A2B',
                        coklatPalingGelap: '#654321',
                        latarCoklat: '#FFF5EB',
                        garisCoklat: '#E8D4C0',
                    },
                    fontFamily: { poppins: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        * { font-family: 'Poppins', sans-serif; margin:0; padding:0; box-sizing:border-box; }
        body {
            background: linear-gradient(180deg, #FFF5EB 0%, #E8D4C0 100%);
            padding: 16px;
            min-height: 100vh;
        }
        .wadah {
            max-width: 480px;
            margin: 0 auto;
            background: #FFFFFF;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(139,90,43,0.15);
        }
        .kembali {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #8B5A2B;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 15px;
        }
        .kembali:hover { color: #654321; }
        .judul {
            font-size: 26px;
            font-weight: 700;
            color: #8B5A2B;
            text-align: center;
            margin-bottom: 6px;
        }
        .keterangan {
            text-align: center;
            font-size: 14px;
            color: #7A5533;
            margin-bottom: 24px;
        }
        .bagian {
            background: #FFF5EB;
            border: 2px solid #E8D4C0;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
            width: 100%;
        }
        .judul-bagian {
            font-size: 18px;
            font-weight: 700;
            color: #8B5A2B;
            margin-bottom: 16px;
            display: block;
        }
        .label {
            font-size: 15px;
            font-weight: 600;
            color: #654321;
            margin-bottom: 6px;
            display: block;
        }
        .input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E8D4C0;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
            transition: 0.2s;
            background: #FFF;
            display: block;
        }
        .input:focus { border-color: #8B5A2B; background: #FFF; }
        .kotak-upload {
            width: 100%;
            border: 2px dashed #B57F50;
            border-radius: 12px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 12px;
            background: #FFF;
            transition: 0.2s;
            display: block;
            box-sizing: border-box;
        }
        .kotak-upload:hover { background: #FFF5EB; border-color: #8B5A2B; }
        .kotak-upload i {
            font-size: 32px;
            color: #B57F50;
            margin-bottom: 8px;
            display: block;
        }
        .kotak-upload .teks-utama {
            font-size: 16px;
            font-weight: 600;
            color: #8B5A2B;
            margin-bottom: 4px;
            display: block;
        }
        .kotak-upload .teks-kecil {
            font-size: 14px;
            color: #887058;
            display: block;
        }
        .pratinjau-foto {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .pratinjau-foto img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #B57F50;
        }
        .info-bayar {
            background: #FFF5EB;
            border: 2px solid #E8D4C0;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        .info-bayar p { font-size: 15px; color: #654321; margin: 6px 0; }
        .info-bayar .nomor { font-size: 17px; font-weight: 700; color: #8B5A2B; }
        .info-bayar img {
            width: 170px;
            border-radius: 10px;
            border: 2px solid #B57F50;
            margin: 12px auto;
            display: block;
        }
        .tombol-kirim {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #B57F50 0%, #8B5A2B 100%);
            color: #FFF;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: block;
        }
        .tombol-kirim:hover {
            background: linear-gradient(90deg, #8B5A2B 0%, #654321 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(101,67,33,0.25);
        }
        .sembunyi { display: none !important; }
    </style>
</head>
<body>
<div class="wadah">
    <a href="index.html" class="kembali">
        <i class="fa fa-arrow-left"></i> Kembali ke Beranda
    </a>

    <h1 class="judul">FORMULIR PENDAFTARAN</h1>
    <p id="teksJenis" class="keterangan"></p>

    <form id="formDaftar">
        <div class="bagian">
            <h3 class="judul-bagian">DATA TIM</h3>
            <label class="label">Nama Tim</label>
            <input type="text" id="namaTim" class="input" placeholder="Contoh: Elit FF" required>
            <label class="label">Nama Kapten</label>
            <input type="text" id="namaKapten" class="input" placeholder="Nama lengkap kapten" required>
            <label class="label">Nomor WhatsApp</label>
            <input type="tel" id="waKapten" class="input" placeholder="0812xxxxxxx" required>
            
            <label class="label">Logo Tim</label>
            <label class="kotak-upload">
                <input type="file" id="logoTim" accept="image/*" class="hidden" required onchange="tampilPratinjau(this, 'pratinjauLogo')">
                <i class="fa fa-image"></i>
                <span class="teks-utama">Pilih File Logo</span>
                <span class="teks-kecil">Format: JPG / PNG</span>
            </label>
            <div id="pratinjauLogo" class="pratinjau-foto"></div>

            <label class="label">Jersey Tim</label>
            <label class="kotak-upload">
                <input type="file" id="jerseyTim" accept="image/*" class="hidden" onchange="tampilPratinjau(this, 'pratinjauJersey')">
                <i class="fa fa-shield"></i>
                <span class="teks-utama">Pilih File Jersey</span>
                <span class="teks-kecil">Format: JPG / PNG (Opsional)</span>
            </label>
            <div id="pratinjauJersey" class="pratinjau-foto"></div>
        </div>

        <div id="bagianShare" class="bagian">
            <h3 class="judul-bagian">BUKTI SHARE LINK</h3>
            <label class="label">Wajib upload tepat 5 foto</label>
            <label class="kotak-upload">
                <input type="file" id="buktiShare" accept="image/*" multiple class="hidden" required onchange="tampilPratinjau(this, 'pratinjauShare')">
                <i class="fa fa-share-alt"></i>
                <span class="teks-utama">Pilih 5 Foto Bukti</span>
                <span class="teks-kecil">Pilih semua file sekaligus</span>
            </label>
            <div id="pratinjauShare" class="pratinjau-foto"></div>
        </div>

        <div id="bagianBayar" class="bagian sembunyi">
            <h3 class="judul-bagian">PEMBAYARAN</h3>
            <div class="info-bayar">
                <p>Biaya pendaftaran: Rp 5.000 / Tim</p>
                <img src="qris.png" alt="QRIS Pembayaran">
                <p class="nomor">DANA: 0858xxxxxxx</p>
                <p>Atau scan QRIS di atas</p>
            </div>
            <label class="label">Bukti Transfer</label>
            <label class="kotak-upload">
                <input type="file" id="buktiTransfer" accept="image/*" class="hidden" required onchange="tampilPratinjau(this, 'pratinjauBayar')">
                <i class="fa fa-file-text-o"></i>
                <span class="teks-utama">Pilih File Bukti</span>
                <span class="teks-kecil">Format: JPG / PNG</span>
            </label>
            <div id="pratinjauBayar" class="pratinjau-foto"></div>
        </div>

        <div class="bagian">
            <h3 class="judul-bagian">DATA ANGGOTA TIM</h3>
            <label class="label">Pemain 1</label>
            <input type="text" id="p1Nama" class="input" placeholder="Nama Pemain" required>
            <input type="tel" id="p1Wa" class="input" placeholder="Nomor WA" required>
            <label class="label">Pemain 2</label>
            <input type="text" id="p2Nama" class="input" placeholder="Nama Pemain" required>
            <input type="tel" id="p2Wa" class="input" placeholder="Nomor WA" required>
            <label class="label">Pemain 3</label>
            <input type="text" id="p3Nama" class="input" placeholder="Nama Pemain" required>
            <input type="tel" id="p3Wa" class="input" placeholder="Nomor WA" required>
            <label class="label">Pemain 4</label>
            <input type="text" id="p4Nama" class="input" placeholder="Nama Pemain" required>
            <input type="tel" id="p4Wa" class="input" placeholder="Nomor WA" required>
            <label class="label">Pemain Cadangan 1</label>
            <input type="text" id="p5Nama" class="input" placeholder="Nama Pemain" required>
            <input type="tel" id="p5Wa" class="input" placeholder="Nomor WA" required>
            <label class="label">Pemain Cadangan 2</label>
            <input type="text" id="p6Nama" class="input" placeholder="Nama Pemain" required>
            <input type="tel" id="p6Wa" class="input" placeholder="Nomor WA" required>
        </div>

        <button type="submit" class="tombol-kirim">KIRIM PENDAFTARAN</button>
    </form>
</div>

<script>
// FUNGSI TAMPILKAN PRATINJAU FOTO
function tampilPratinjau(input, wadahId) {
    const wadah = document.getElementById(wadahId);
    wadah.innerHTML = "";
    if (!input.files) return;
    Array.from(input.files).forEach(file => {
        const baca = new FileReader();
        baca.onload = e => {
            const img = document.createElement("img");
            img.src = e.target.result;
            wadah.appendChild(img);
        };
        baca.readAsDataURL(file);
    });
}

const url = new URLSearchParams(window.location.search);
const jenis = url.get('jenis') || 'gratis';
const teksJenis = document.getElementById('teksJenis');
const bagianShare = document.getElementById('bagianShare');
const bagianBayar = document.getElementById('bagianBayar');
const kuota = parseInt(localStorage.getItem('kuotaMaksimal') || '16');
const total = JSON.parse(localStorage.getItem('dataPendaftaran') || '[]').length;

if(jenis === 'gratis') {
    teksJenis.textContent = `PENDAFTARAN GRATIS • Sisa kuota: ${kuota - total} Tim`;
    bagianBayar.classList.add('sembunyi');
    document.getElementById('buktiTransfer').removeAttribute('required');
} else {
    teksJenis.textContent = `PENDAFTARAN BERBAYAR • Sisa kuota: ${kuota - total} Tim`;
    bagianShare.classList.add('sembunyi');
    document.getElementById('buktiShare').removeAttribute('required');
    bagianBayar.classList.remove('sembunyi');
}

function bacaFile(file) {
    return new Promise(siap => {
        const baca = new FileReader();
        baca.onload = e => siap(e.target.result);
        baca.readAsDataURL(file);
    });
}

document.getElementById('formDaftar').addEventListener('submit', async e => {
    e.preventDefault();
    if(!localStorage.getItem('pendaftaranDibuka') || total >= kuota) {
        return alert("⚠️ Pendaftaran sudah ditutup atau penuh!");
    }
    const data = {
        jenis: jenis, namaTim: document.getElementById('namaTim').value.trim(),
        namaKapten: document.getElementById('namaKapten').value.trim(),
        waKapten: document.getElementById('waKapten').value.trim(),
        logo: await bacaFile(document.getElementById('logoTim').files[0]),
        jersey: document.getElementById('jerseyTim').files[0] ? await bacaFile(document.getElementById('jerseyTim').files[0]) : '',
        buktiShare: [], buktiTransfer: '', anggota: []
    };
    if(jenis === 'gratis') {
        const fileShare = document.getElementById('buktiShare').files;
        if(fileShare.length !== 5) return alert("⚠️ Wajib pilih tepat 5 foto!");
        for(let f of fileShare) data.buktiShare.push(await bacaFile(f));
    } else {
        data.buktiTransfer = await bacaFile(document.getElementById('buktiTransfer').files[0]);
    }
    for(let i=1; i<=6; i++) {
        data.anggota.push({
            nama: document.getElementById(`p${i}Nama`).value.trim(),
            wa: document.getElementById(`p${i}Wa`).value.trim()
        });
    }
    const semua = JSON.parse(localStorage.getItem('dataPendaftaran') || '[]');
    semua.push(data);
    localStorage.setItem('dataPendaftaran', JSON.stringify(semua));
    alert(`✅ Berhasil daftar sebagai ${jenis.toUpperCase()}!`);
    window.location.href = "index.html";
});
</script>
</body>
</html>
