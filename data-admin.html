<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HALAMAN ADMIN - BATTLE OF MASTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coklatTerang: '#D4A574',
                        coklatUtama: '#B57F50',
                        coklatGelap: '#8B5A2B',
                        coklatPalingGelap: '#654321',
                        latarCoklat: '#FFF5EB',
                        garisCoklat: '#E8D4C0',
                        hijau: '#2E8B57',
                        merah: '#DC143C',
                    },
                    fontFamily: { poppins: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        * { font-family: 'Poppins', sans-serif; margin:0; padding:0; box-sizing:border-box; }
        body {
            background: linear-gradient(180deg, #FFF5EB 0%, #E8D4C0 100%);
            padding: 16px;
            min-height: 100vh;
        }
        .layar-login {
            position: fixed; inset: 0; background: rgba(0,0,0,0.35);
            display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 9999;
        }
        .kotak-login {
            background: #FFFFFF; border-radius: 16px; padding: 32px 24px;
            width: 100%; max-width: 360px; box-shadow: 0 8px 30px rgba(139,90,43,0.25);
            border: 2px solid #E8D4C0;
        }
        .kotak-login h2 { font-size: 22px; font-weight:700; color:#8B5A2B; text-align:center; margin-bottom:8px; }
        .kotak-login p { font-size:14px; color:#7A5533; text-align:center; margin-bottom:20px; }
        .input-kode {
            width:100%; padding:14px 16px; border:2px solid #E8D4C0; border-radius:10px;
            font-size:16px; text-align:center; outline:none; margin-bottom:16px;
        }
        .input-kode:focus { border-color:#8B5A2B; }
        .grup-tombol { display:flex; gap:10px; }
        .tombol-batal { flex:1; padding:13px; border:2px solid #E8D4C0; background:#FFF; color:#8B5A2B; font-weight:600; border-radius:10px; cursor:pointer; }
        .tombol-masuk { flex:1; padding:13px; border:none; background:linear-gradient(90deg,#B57F50,#8B5A2B); color:#FFF; font-weight:700; border-radius:10px; cursor:pointer; }
        .wadah { max-width:480px; margin:0 auto; background:#FFF; border-radius:16px; padding:24px; box-shadow:0 4px 15px rgba(139,90,43,0.15); }
        .kembali { display:flex; align-items:center; gap:6px; color:#8B5A2B; font-weight:600; text-decoration:none; margin-bottom:20px; font-size:15px; }
        .judul { font-size:26px; font-weight:700; color:#8B5A2B; text-align:center; margin-bottom:16px; }
        .kotak-status { background:#FFF5EB; border:2px solid #E8D4C0; border-radius:12px; padding:16px; margin-bottom:16px; }
        .label-status { font-size:15px; font-weight:600; color:#654321; margin-bottom:8px; display:block; }
        .status { padding:10px; border-radius:8px; text-align:center; font-weight:600; margin-bottom:10px; }
        .status.buka { background:#E6FFFA; color:#2E8B57; border:2px solid #2E8B57; }
        .status.tutup { background:#FFEEEE; color:#DC143C; border:2px solid #DC143C; }
        .tombol { width:100%; padding:13px; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; margin-bottom:10px; }
        .tombol.buka { background:#2E8B57; color:#FFF; }
        .tombol.tutup { background:#DC143C; color:#FFF; }
        .tombol.merah { background:#B57F50; color:#FFF; }
        .info { background:#FFF5EB; border:2px solid #E8D4C0; border-radius:12px; padding:16px; margin-bottom:16px; text-align:center; }
        .jumlah { font-size:22px; font-weight:700; color:#8B5A2B; margin:8px 0; }
        .tim { border:2px solid #E8D4C0; border-radius:12px; padding:16px; margin-bottom:12px; background:#FFF; }
        .tim h4 { color:#8B5A2B; font-size:18px; margin-bottom:8px; }
        .tim p { font-size:14px; color:#654321; margin:4px 0; }
        .tim img { max-width:100px; border-radius:8px; margin:8px 4px; cursor:pointer; }
        .sembunyi { display:none !important; }
    </style>
</head>
<body>
<div id="layarLogin" class="layar-login">
    <div class="kotak-login">
        <h2>🔐 AKSES ADMIN</h2>
        <p>Masukkan kode rahasia untuk mengelola turnamen</p>
        <input type="password" id="inputKode" class="input-kode" placeholder="Ketik kode akses">
        <div class="grup-tombol">
            <button class="tombol-batal" onclick="location.href='index.html'">BATAL</button>
            <button class="tombol-masuk" onclick="prosesLogin()">MASUK</button>
        </div>
    </div>
</div>

<div id="isiAdmin" class="wadah sembunyi">
    <a href="index.html" class="kembali"><i class="fa fa-arrow-left"></i> Kembali ke Beranda</a>
    <h1 class="judul">PENGATURAN & DATA PENDAFTARAN</h1>

    <!-- BAGIAN PENDAFTARAN GRATIS -->
    <div class="kotak-status">
        <span class="label-status">🎁 PENDAFTARAN GRATIS</span>
        <div id="statusGratis" class="status tutup">Memuat...</div>
        <button id="tombolGratis" class="tombol tutup" onclick="ubahGratis()">Memuat...</button>
    </div>

    <!-- BAGIAN PENDAFTARAN BERBAYAR -->
    <div class="kotak-status">
        <span class="label-status">💳 PENDAFTARAN BERBAYAR</span>
        <div id="statusBayar" class="status tutup">Memuat...</div>
        <button id="tombolBayar" class="tombol tutup" onclick="ubahBayar()">Memuat...</button>
    </div>

    <div class="info">
        <p>Jumlah Tim Terdaftar:</p>
        <div class="jumlah" id="jumlahTim">0 / 16</div>
    </div>

    <button class="tombol merah" onclick="simpanCadangan()"><i class="fa fa-download"></i> Simpan & Cadangkan Data</button>
    <button class="tombol tutup" onclick="kosongkanData()"><i class="fa fa-trash"></i> Kosongkan Data Pendaftaran</button>

    <hr style="margin:20px 0; border-color:#E8D4C0;">
    <h3 style="color:#8B5A2B; margin-bottom:12px;">DAFTAR TIM PENDAFTAR</h3>
    <div id="daftarTim"></div>
</div>

<script>
const KODE_ADMIN = "BOM2026";

function prosesLogin() {
    const input = document.getElementById('inputKode').value.trim();
    if(input === KODE_ADMIN) {
        document.getElementById('layarLogin').classList.add('sembunyi');
        document.getElementById('isiAdmin').classList.remove('sembunyi');
        tampilSemuaStatus(); tampilData();
    } else {
        alert("❌ Kode akses salah!");
        document.getElementById('inputKode').value = "";
    }
}
document.getElementById('inputKode').addEventListener('keydown', e=>{if(e.key==='Enter') prosesLogin();});

// UBAH STATUS PENDAFTARAN GRATIS
function ubahGratis() {
    const sekarang = localStorage.getItem('gratisDibuka') === 'true';
    if(sekarang) {
        if(!confirm("⚠️ Yakin ingin MENUTUP PENDAFTARAN GRATIS?\nPendaftar gratis tidak bisa kirim formulir lagi!")) return;
        localStorage.setItem('gratisDibuka', 'false');
        alert("✅ PENDAFTARAN GRATIS BERHASIL DITUTUP!");
    } else {
        if(!confirm("⚠️ Yakin ingin MEMBUKA PENDAFTARAN GRATIS?")) return;
        localStorage.setItem('gratisDibuka', 'true');
        alert("✅ PENDAFTARAN GRATIS BERHASIL DIBUKA!");
    }
    tampilSemuaStatus();
}

// UBAH STATUS PENDAFTARAN BERBAYAR
function ubahBayar() {
    const sekarang = localStorage.getItem('bayarDibuka') === 'true';
    if(sekarang) {
        if(!confirm("⚠️ Yakin ingin MENUTUP PENDAFTARAN BERBAYAR?\nPendaftar berbayar tidak bisa kirim formulir lagi!")) return;
        localStorage.setItem('bayarDibuka', 'false');
        alert("✅ PENDAFTARAN BERBAYAR BERHASIL DITUTUP!");
    } else {
        if(!confirm("⚠️ Yakin ingin MEMBUKA PENDAFTARAN BERBAYAR?")) return;
        localStorage.setItem('bayarDibuka', 'true');
        alert("✅ PENDAFTARAN BERBAYAR BERHASIL DIBUKA!");
    }
    tampilSemuaStatus();
}

function tampilSemuaStatus() {
    const kuota = parseInt(localStorage.getItem('kuotaMaksimal') || '16');
    const total = JSON.parse(localStorage.getItem('dataPendaftaran') || '[]').length;

    // Tampil Gratis
    const bukaGratis = localStorage.getItem('gratisDibuka') === 'true';
    const stGratis = document.getElementById('statusGratis');
    const tbGratis = document.getElementById('tombolGratis');
    if(bukaGratis && total < kuota) {
        stGratis.className = "status buka";
        stGratis.innerHTML = `<i class="fa fa-check-circle"></i> SEDANG DIBUKA`;
        tbGratis.className = "tombol tutup";
        tbGratis.innerHTML = `<i class="fa fa-lock"></i> TUTUP GRATIS`;
    } else {
        stGratis.className = "status tutup";
        stGratis.innerHTML = `<i class="fa fa-times-circle"></i> SUDAH DITUTUP`;
        tbGratis.className = "tombol buka";
        tbGratis.innerHTML = `<i class="fa fa-unlock"></i> BUKA GRATIS`;
    }

    // Tampil Berbayar
    const bukaBayar = localStorage.getItem('bayarDibuka') === 'true';
    const stBayar = document.getElementById('statusBayar');
    const tbBayar = document.getElementById('tombolBayar');
    if(bukaBayar && total < kuota) {
        stBayar.className = "status buka";
        stBayar.innerHTML = `<i class="fa fa-check-circle"></i> SEDANG DIBUKA`;
        tbBayar.className = "tombol tutup";
        tbBayar.innerHTML = `<i class="fa fa-lock"></i> TUTUP BERBAYAR`;
    } else {
        stBayar.className = "status tutup";
        stBayar.innerHTML = `<i class="fa fa-times-circle"></i> SUDAH DITUTUP`;
        tbBayar.className = "tombol buka";
        tbBayar.innerHTML = `<i class="fa fa-unlock"></i> BUKA BERBAYAR`;
    }

    document.getElementById('jumlahTim').textContent = `${total} / ${kuota}`;
}

function simpanCadangan() {
    const data = localStorage.getItem('dataPendaftaran') || '[]';
    const nama = "PENDAFTARAN BATTLE OF MASTER S1 - " + new Date().toLocaleDateString('id-ID') + ".json";
    const blob = new Blob([data], {type:'application/json'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob); link.download = nama; link.click();
    URL.revokeObjectURL(link.href); alert("✅ Data tersimpan!");
}

function kosongkanData() {
    if(!confirm("⚠️ Yakin hapus SEMUA data pendaftaran?")) return;
    localStorage.removeItem('dataPendaftaran');
    tampilSemuaStatus(); tampilData(); alert("✅ Data dikosongkan!");
}

function tampilData() {
    const wadah = document.getElementById('daftarTim');
    const semua = JSON.parse(localStorage.getItem('dataPendaftaran') || '[]');
    wadah.innerHTML = "";
    if(semua.length === 0) { wadah.innerHTML = `<p style="text-align:center; color:#887058;">Belum ada tim</p>`; return; }
    semua.forEach((tim,urut)=>{
        const kotak = document.createElement('div'); kotak.className = "tim";
        kotak.innerHTML = `
            <h4>TIM KE-${urut+1}: ${tim.namaTim} <span style="font-size:13px; font-weight:normal; color:#7A5533;">(${tim.jenis.toUpperCase()})</span></h4>
            <p><b>Kapten:</b> ${tim.namaKapten}</p>
            <p><b>WA:</b> ${tim.waKapten}</p>
            ${tim.logo?`<p><b>Logo:</b></p><img src="${tim.logo}" onclick="window.open('${tim.logo}')">`:""}
            ${tim.jersey?`<p><b>Jersey:</b></p><img src="${tim.jersey}" onclick="window.open('${tim.jersey}')">`:""}
            <p><b>Anggota:</b></p>
            ${tim.anggota.map((a,i)=>`<p>• Pemain ${i+1}: ${a.nama} (${a.wa})</p>`).join('')}
        `;
        wadah.appendChild(kotak);
    });
}
</script>
</body>
</html>
