<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HALAMAN ADMIN - BATTLE OF MASTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coklatTerang: '#D4A574',
                        coklatUtama: '#B57F50',
                        coklatGelap: '#8B5A2B',
                        coklatPalingGelap: '#654321',
                        latarCoklat: '#FFF5EB',
                        garisCoklat: '#E8D4C0',
                    },
                    fontFamily: { poppins: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        * { font-family: 'Poppins', sans-serif; margin:0; padding:0; box-sizing:border-box; }
        body { 
            background: linear-gradient(180deg, #FFF5EB 0%, #E8D4C0 100%); 
            padding: 20px 16px;
            min-height: 100vh;
        }
        .wadah { max-width: 700px; margin: 0 auto; }
        .judul-atas { text-align: center; margin-bottom: 20px; }
        .judul-atas h1 { font-size: 28px; font-weight: 800; color: #8B5A2B; margin-bottom: 8px; }
        .judul-atas p { font-size: 14px; color: #7A5533; }
        .label-peran { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; color: #FFF; margin-bottom: 10px; }
        .peran-owner { background: #8B5A2B; }
        .peran-admin { background: #A67C52; }
        .kotak-login {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 24px;
            border: 2px solid #E8D4C0;
            box-shadow: 0 4px 12px rgba(139,90,43,0.15);
            max-width: 420px;
            margin: 80px auto 0;
        }
        .kotak-login h3 { font-size: 20px; font-weight: 700; color: #8B5A2B; margin-bottom: 16px; }
        .input-kode {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E8D4C0;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
        }
        .input-kode:focus { border-color: #8B5A2B; }
        .tombol {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            color: #FFF;
        }
        .tombol-coklat { background: linear-gradient(90deg, #B57F50, #8B5A2B); }
        .tombol-coklat:hover { background: linear-gradient(90deg, #8B5A2B, #654321); }
        .tombol-merah { background: #C25450; }
        .tombol-merah:hover { background: #A03F3B; }
        .tombol-nonaktif { background: #C9B8A5; cursor: not-allowed; opacity: 0.7; }
        .kotak-pengaturan {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 20px;
            border: 2px solid #E8D4C0;
            margin-bottom: 24px;
        }
        .baris { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
        .input-angka {
            padding: 10px 12px;
            border: 2px solid #E8D4C0;
            border-radius: 8px;
            width: 90px;
            font-size: 15px;
            outline: none;
        }
        .input-angka:focus { border-color: #8B5A2B; }
        .kotak-tim {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 20px;
            border: 2px solid #E8D4C0;
            margin-bottom: 16px;
        }
        .tim-nama { font-size: 18px; font-weight: 700; color: #8B5A2B; margin-bottom: 10px; }
        .tim-data { font-size: 14px; color: #654321; margin: 6px 0; }
        .foto-bukti { max-width: 120px; border-radius: 8px; border: 1px solid #E8D4C0; margin: 8px 4px; cursor: zoom-in; }
        .peringatan {
            margin-top: 16px;
            padding: 12px;
            background: #FFF5EB;
            border-radius: 8px;
            font-size: 13px;
            color: #7A5533;
            line-height: 1.6;
        }
        .sembunyi { display: none !important; }
    </style>
</head>
<body>
<div class="wadah">
    <!-- BAGIAN LOGIN -->
    <div id="bagianLogin">
        <div class="kotak-login">
            <h3>MASUK ADMIN</h3>
            <input type="password" id="kodeAkses" class="input-kode" placeholder="Masukkan kode akses">
            <button onclick="cekLogin()" class="tombol tombol-coklat w-full">MASUK</button>
            <div class="peringatan">
                <i class="fa fa-exclamation-circle"></i> Halaman ini khusus Owner & Admin resmi. Jangan bagikan kode akses.
            </div>
        </div>
    </div>

    <!-- BAGIAN UTAMA -->
    <div id="bagianUtama" class="sembunyi">
        <div class="judul-atas">
            <span id="labelPeran" class="label-peran"></span>
            <h1>DASHBOARD PENDAFTARAN</h1>
            <p>BATTLE OF MASTER - Pengelola Data Pendaftaran</p>
        </div>

        <div class="kotak-pengaturan">
            <h3 class="font-bold text-coklatGelap mb-3">PENGATURAN UMUM</h3>
            <div class="baris">
                <button id="btnBuka" onclick="bukaDaftar()" class="tombol tombol-coklat">Buka Pendaftaran</button>
                <button id="btnTutup" onclick="tutupDaftar()" class="tombol tombol-merah">Tutup Pendaftaran</button>
            </div>
            <div class="baris">
                <label>Batas Kuota Tim:</label>
                <input type="number" id="batasKuota" class="input-angka" value="16" min="1">
                <button id="btnSimpanKuota" onclick="simpanKuota()" class="tombol tombol-coklat">Simpan</button>
            </div>
            <p class="text-sm mt-2 text-coklatPalingGelap">Status: <span id="statusDaftar">Tertutup</span> | Total Terdaftar: <span id="jumlahTerdaftar">0</span> Tim</p>
        </div>

        <div id="daftarTim"></div>
        <button id="btnHapusSemua" onclick="hapusSemua()" class="tombol tombol-merah w-full mt-4">Hapus Semua Data Pendaftaran</button>
    </div>
</div>

<script>
// DAFTAR AKUN & HAK AKSES
const daftarAkun = {
    "owner01": { peran: "Owner", aksesPenuh: true },
    "admin01": { peran: "Admin 1", aksesPenuh: false },
    "admin02": { peran: "Admin 2", aksesPenuh: false }
};

function cekLogin() {
    const input = document.getElementById('kodeAkses').value.trim();
    if(daftarAkun[input]) {
        const dataAkun = daftarAkun[input];
        document.getElementById('bagianLogin').classList.add('sembunyi');
        document.getElementById('bagianUtama').classList.remove('sembunyi');

        // Tampilkan peran
        const label = document.getElementById('labelPeran');
        label.textContent = dataAkun.peran.toUpperCase();
        label.className = "label-peran " + (dataAkun.aksesPenuh ? "peran-owner" : "peran-admin");

        // Nonaktifkan fitur jika bukan Owner
        if(!dataAkun.aksesPenuh) {
            document.getElementById('btnBuka').className = "tombol tombol-nonaktif";
            document.getElementById('btnBuka').disabled = true;
            document.getElementById('btnTutup').className = "tombol tombol-nonaktif";
            document.getElementById('btnTutup').disabled = true;
            document.getElementById('btnSimpanKuota').className = "tombol tombol-nonaktif";
            document.getElementById('btnSimpanKuota').disabled = true;
            document.getElementById('btnHapusSemua').className = "tombol tombol-nonaktif";
            document.getElementById('btnHapusSemua').disabled = true;
        }

        tampilkanData();
        updateStatus();
    } else {
        alert("❌ Kode akses salah!");
    }
}

// FUNGSI PENGATURAN
function bukaDaftar() { localStorage.setItem('pendaftaranDibuka', 'true'); updateStatus(); }
function tutupDaftar() { localStorage.setItem('pendaftaranDibuka', 'false'); updateStatus(); }
function simpanKuota() {
    localStorage.setItem('kuotaMaksimal', document.getElementById('batasKuota').value);
    alert("✅ Batas kuota tersimpan!");
    tampilkanData();
}
function updateStatus() {
    const buka = localStorage.getItem('pendaftaranDibuka') === 'true';
    document.getElementById('statusDaftar').textContent = buka ? "TERBUKA" : "TERTUTUP";
    document.getElementById('statusDaftar').style.color = buka ? "#15803D" : "#C25450";
    const data = JSON.parse(localStorage.getItem('dataPendaftaran') || '[]');
    document.getElementById('jumlahTerdaftar').textContent = data.length;
}

// TAMPILKAN DATA
function tampilkanData() {
    const wadah = document.getElementById('daftarTim');
    const data = JSON.parse(localStorage.getItem('dataPendaftaran') || '[]');
    wadah.innerHTML = "";
    if(data.length === 0) {
        wadah.innerHTML = "<p class='text-center text-coklatPalingGelap py-8'>Belum ada tim yang mendaftar saat ini</p>";
        return;
    }
    data.forEach((tim, no) => {
        const kartu = document.createElement('div');
        kartu.className = "kotak-tim";
        kartu.innerHTML = `
            <div class="tim-nama">${no+1}. ${tim.namaTim} <span class="text-sm font-normal px-2 py-1 rounded ${tim.jenis === 'gratis' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}">${tim.jenis.toUpperCase()}</span></div>
            <div class="tim-data">👤 Kapten: ${tim.namaKapten} | 📞 ${tim.waKapten}</div>
            <div class="tim-data">📋 Anggota: ${tim.anggota.map(a => a.nama).join(', ')}</div>
            ${tim.logo ? `<p class="tim-data">🖼️ Logo Tim:</p><img src="${tim.logo}" class="foto-bukti" onclick="window.open('${tim.logo}')">` : ''}
            ${tim.jersey ? `<p class="tim-data">👕 Jersey Tim:</p><img src="${tim.jersey}" class="foto-bukti" onclick="window.open('${tim.jersey}')">` : ''}
            ${tim.buktiShare.length > 0 ? `<p class="tim-data">📸 Bukti Share:</p>${tim.buktiShare.map(f=>`<img src="${f}" class="foto-bukti" onclick="window.open('${f}')">`).join('')}` : ''}
            ${tim.buktiTransfer ? `<p class="tim-data">🧾 Bukti Transfer:</p><img src="${tim.buktiTransfer}" class="foto-bukti" onclick="window.open('${tim.buktiTransfer}')">` : ''}
            ${daftarAkun[document.getElementById('kodeAkses').value]?.aksesPenuh ? 
                `<button onclick="hapusTim(${no})" class="tombol tombol-merah mt-3">Hapus Tim Ini</button>` : 
                `<p class="text-sm text-gray-500 mt-3">Hanya Owner yang bisa menghapus</p>`
            }
        `;
        wadah.appendChild(kartu);
    });
}

// HAPUS DATA
function hapusTim(indeks) {
    if(confirm("Yakin hapus tim ini?")) {
        const data = JSON.parse(localStorage.getItem('dataPendaftaran') || '[]');
        data.splice(indeks,1);
        localStorage.setItem('dataPendaftaran', JSON.stringify(data));
        tampilkanData(); updateStatus();
    }
}
function hapusSemua() {
    if(confirm("⚠️ Yakin hapus SEMUA data?")) {
        localStorage.removeItem('dataPendaftaran');
        tampilkanData(); updateStatus();
    }
}
</script>
</body>
</html>
