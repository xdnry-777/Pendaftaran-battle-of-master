<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HALAMAN ADMIN - BATTLE OF MASTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coklatTerang: '#D4A574',
                        coklatUtama: '#B57F50',
                        coklatGelap: '#8B5A2B',
                        coklatPalingGelap: '#654321',
                        latarCoklat: '#FFF5EB',
                        garisCoklat: '#E8D4C0',
                        hijau: '#2E8B57',
                        merah: '#DC143C',
                    },
                    fontFamily: { poppins: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        * { font-family: 'Poppins', sans-serif; margin:0; padding:0; box-sizing:border-box; }
        body {
            background: linear-gradient(180deg, #FFF5EB 0%, #E8D4C0 100%);
            padding: 16px;
            min-height: 100vh;
        }
        .wadah {
            max-width: 480px;
            margin: 0 auto;
            background: #FFFFFF;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(139,90,43,0.15);
        }
        .kembali {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #8B5A2B;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 15px;
        }
        .kembali:hover { color: #654321; }
        .judul {
            font-size: 26px;
            font-weight: 700;
            color: #8B5A2B;
            text-align: center;
            margin-bottom: 16px;
        }
        /* KOTAK LOGIN KODE AKSES DESAIN SESUAI */
        .layar-login {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            padding: 20px; z-index: 999;
        }
        .kotak-login {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 28px 24px;
            width: 100%; max-width: 380px;
            box-shadow: 0 8px 25px rgba(101,67,33,0.2);
            border: 2px solid #E8D4C0;
        }
        .kotak-login h3 {
            color: #8B5A2B; font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 8px;
        }
        .kotak-login p {
            color: #7A5533; font-size: 14px; text-align: center; margin-bottom: 20px;
        }
        .input-kode {
            width: 100%; padding: 14px 16px;
            border: 2px solid #E8D4C0; border-radius: 10px;
            font-size: 16px; text-align: center;
            outline: none; transition: 0.2s; margin-bottom: 16px;
        }
        .input-kode:focus { border-color: #8B5A2B; background: #FFF; }
        .tombol-login {
            display: flex; gap: 10px;
        }
        .tombol-batal {
            flex: 1; padding: 12px; border: 2px solid #E8D4C0;
            background: #FFF; color: #8B5A2B; font-weight: 600; border-radius: 10px; cursor: pointer; transition: 0.2s;
        }
        .tombol-masuk {
            flex: 1; padding: 12px; border: none;
            background: linear-gradient(90deg, #B57F50 0%, #8B5A2B 100%);
            color: #FFF; font-weight: 700; border-radius: 10px; cursor: pointer; transition: 0.2s;
        }
        .tombol-batal:hover { background: #FFF5EB; }
        .tombol-masuk:hover { transform: translateY(-2px); }

        .status {
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .status.buka { background: #E6FFFA; color: #2E8B57; border: 2px solid #2E8B57; }
        .status.tutup { background: #FFEEEE; color: #DC143C; border: 2px solid #DC143C; }
        .tombol {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 12px;
            transition: 0.2s;
        }
        .tombol.buka { background: #2E8B57; color: #FFF; }
        .tombol.tutup { background: #DC143C; color: #FFF; }
        .tombol.merah { background: #B57F50; color: #FFF; }
        .tombol:hover { transform: translateY(-2px); }
        .info {
            background: #FFF5EB;
            border: 2px solid #E8D4C0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: center;
        }
        .jumlah { font-size: 24px; font-weight: 700; color: #8B5A2B; margin: 8px 0; }
        .tim {
            border: 2px solid #E8D4C0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            background: #FFF;
        }
        .tim h4 { color: #8B5A2B; font-size: 18px; margin-bottom: 8px; }
        .tim p { font-size: 14px; color: #654321; margin: 4px 0; }
        .tim img { max-width: 100px; border-radius: 8px; margin: 8px 4px; cursor: pointer; }
        .sembunyi { display: none !important; }
    </style>
</head>
<body>

<!-- LAYAR LOGIN KODE AKSES DESAIN BARU -->
<div id="layarLogin" class="layar-login">
    <div class="kotak-login">
        <h3>AKSES ADMIN</h3>
        <p>Masukkan kode rahasia untuk masuk</p>
        <input type="password" id="inputKode" class="input-kode" placeholder="Masukkan kode akses">
        <div class="tombol-login">
            <button class="tombol-batal" onclick="window.location.href='index.html'">BATAL</button>
            <button class="tombol-masuk" onclick="cekKode()">MASUK</button>
        </div>
    </div>
</div>

<!-- ISI HALAMAN ADMIN -->
<div id="isiAdmin" class="wadah sembunyi">
    <a href="index.html" class="kembali"><i class="fa fa-arrow-left"></i> Kembali ke Beranda</a>
    <h1 class="judul">PENGATURAN & DATA PENDAFTARAN</h1>

    <div id="statusPendaftaran" class="status tutup">
        <i class="fa fa-info-circle"></i> Memuat status...
    </div>

    <button id="tombolBukaTutup" class="tombol tutup" onclick="ubahStatus()">
        Memuat...
    </button>

    <div class="info">
        <p>Jumlah Tim Terdaftar:</p>
        <div class="jumlah" id="jumlahTim">0 / 16</div>
    </div>

    <button class="tombol merah" onclick="simpanCadangan()">
        <i class="fa fa-download"></i> Simpan & Cadangkan Semua Data
    </button>
    <button class="tombol tutup" onclick="kosongkanData()">
        <i class="fa fa-trash"></i> Kosongkan Data Pendaftaran
    </button>

    <hr style="margin:20px 0; border-color:#E8D4C0;">
    <h3 style="color:#8B5A2B; margin-bottom:12px;">DAFTAR TIM PENDAFTAR</h3>
    <div id="daftarTim"></div>
</div>

<script>
const KODE_ADMIN = "BOM2026";

// CEK KODE DENGAN TAMPILAN DESAIN
function cekKode() {
    const input = document.getElementById('inputKode').value.trim();
    if(input === KODE_ADMIN) {
        document.getElementById('layarLogin').classList.add('sembunyi');
        document.getElementById('isiAdmin').classList.remove('sembunyi');
        tampilStatus();
        tampilData();
    } else {
        alert("❌ Kode akses salah! Silakan coba lagi.");
        document.getElementById('inputKode').value = "";
        document.getElementById('inputKode').focus();
    }
}

// TEKAN ENTER UNTUK KIRIM
document.getElementById('inputKode').addEventListener('keydown', e => {
    if(e.key === 'Enter') cekKode();
});

// UBAH STATUS PENDAFTARAN + PERINGATAN
function ubahStatus() {
    const sekarang = localStorage.getItem('pendaftaranDibuka') === 'true';
    if(sekarang) {
        const konfirmasi = confirm("⚠️ Yakin ingin MENUTUP pendaftaran?\nSetelah ditutup, pendaftar tidak bisa mengirim formulir lagi!");
        if(!konfirmasi) return;
        localStorage.setItem('pendaftaranDibuka', 'false');
        alert("✅ Pendaftaran BERHASIL DITUTUP!\nPendaftar sekarang tidak bisa mengirim data.");
    } else {
        const konfirmasi = confirm("⚠️ Yakin ingin MEMBUKA pendaftaran?");
        if(!konfirmasi) return;
        localStorage.setItem('pendaftaranDibuka', 'true');
        alert("✅ Pendaftaran BERHASIL DIBUKA!\nPendaftar sekarang bisa mengirim formulir.");
    }
    tampilStatus();
}

function tampilStatus() {
    const buka = localStorage.getItem('pendaftaranDibuka') === 'true';
    const tombol = document.getElementById('tombolBukaTutup');
    const status = document.getElementById('statusPendaftaran');
    const kuota = parseInt(localStorage.getItem('kuotaMaksimal') || '16');
    const total = JSON.parse(localStorage.getItem('dataPendaftaran') || '[]').length;

    if(buka && total < kuota) {
        status.className = "status buka";
        status.innerHTML = `<i class="fa fa-check-circle"></i> PENDAFTARAN SEDANG DIBUKA • Sisa ${kuota-total} kuota`;
        tombol.className = "tombol tutup";
        tombol.innerHTML = `<i class="fa fa-lock"></i> TUTUP PENDAFTARAN`;
    } else {
        status.className = "status tutup";
        status.innerHTML = `<i class="fa fa-times-circle"></i> PENDAFTARAN SUDAH DITUTUP ${total>=kuota?"(Kuota Penuh)":""}`;
        tombol.className = "tombol buka";
        tombol.innerHTML = `<i class="fa fa-unlock"></i> BUKA PENDAFTARAN`;
    }
    document.getElementById('jumlahTim').textContent = `${total} / ${kuota}`;
}

function simpanCadangan() {
    const data = localStorage.getItem('dataPendaftaran') || '[]';
    const namaFile = "PENDAFTARAN BATTLE OF MASTER S1 - " + new Date().toLocaleDateString('id-ID') + ".json";
    const blob = new Blob([data], {type:'application/json'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = namaFile;
    link.click();
    URL.revokeObjectURL(link.href);
    alert("✅ Data berhasil disimpan ke file!");
}

function kosongkanData() {
    const konfirmasi = confirm("⚠️ Yakin ingin menghapus SEMUA data pendaftaran?\nData yang sudah dicadangkan tetap aman di file yang kamu unduh.");
    if(!konfirmasi) return;
    localStorage.removeItem('dataPendaftaran');
    tampilStatus();
    tampilData();
    alert("✅ Data pendaftaran sudah dikosongkan!");
}

function tampilData() {
    const wadah = document.getElementById('daftarTim');
    const semua = JSON.parse(localStorage.getItem('dataPendaftaran') || '[]');
    wadah.innerHTML = "";
    if(semua.length === 0) {
        wadah.innerHTML = `<p style="text-align:center; color:#887058;">Belum ada tim yang mendaftar</p>`;
        return;
    }
    semua.forEach((tim, urut) => {
        const kotak = document.createElement('div');
        kotak.className = "tim";
        kotak.innerHTML = `
            <h4>TIM KE-${urut+1}: ${tim.namaTim}</h4>
            <p><b>Kapten:</b> ${tim.namaKapten}</p>
            <p><b>WA Kapten:</b> ${tim.waKapten}</p>
            <p><b>Jenis Daftar:</b> ${tim.jenis.toUpperCase()}</p>
            ${tim.logo?`<p><b>Logo Tim:</b></p><img src="${tim.logo}" alt="Logo" onclick="window.open('${tim.logo}')">`:""}
            ${tim.jersey?`<p><b>Jersey Tim:</b></p><img src="${tim.jersey}" alt="Jersey" onclick="window.open('${tim.jersey}')">`:""}
            <p><b>Anggota Tim:</b></p>
            ${tim.anggota.map((a,i)=>`<p>• Pemain ${i+1}: ${a.nama} (${a.wa})</p>`).join('')}
        `;
        wadah.appendChild(kotak);
    });
}
</script>
</body>
</html>
